name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk UARPLauncher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UARPLauncher-apk
          path: UARPLauncher.apk

      # Готовий APK для скачування з телефона: сторінка «Releases» репозиторію
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest UARPLauncher.apk \
            --title "UA RolePlay Launcher" \
            --notes "Остання збірка лаунчера. Завантажте UARPLauncher.apk і встановіть на телефон."

      # Копія APK в окремій гілці apk
      - name: Save APK to branch
        run: |
          mkdir /tmp/apk && cp UARPLauncher.apk /tmp/apk/
          cd /tmp/apk
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add UARPLauncher.apk
          git commit -qm "APK build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
